name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# The whole toolchain is unified on Python 3.14: the standalone runtime, the
# C extensions, the docs and this CI all target 3.14. setup-uv installs it on
# demand (uv manages its own python-build-standalone 3.14 on every runner).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9"

      - name: Install dependencies
        run: |
          uv venv --python python3.14 .venv
          uv pip install --python .venv/bin/python "ruff>=0.4"

      # Hard gate: every first-party module must be VALID Python 3.14 (parse).
      # compileall is green on the current tree (944 files) and catches the real
      # regression class (a file no longer parsing under 3.14). The legacy
      # ruff style findings (16k+ py2->py3 debt) are reported below but do not
      # gate the build until the Phase-1 cleanup lands.
      - name: Python 3.14 syntax gate (compileall)
        run: .venv/bin/python -m compileall -q ccpnmr2.5/python/

      - name: Ruff style debt report (informational — NOT a build gate)
        run: .venv/bin/ruff check ccpnmr2.5/python/ --statistics 2>&1 | tail -40 \
          || echo "style debt present — see statistics (Phase 1)"

      - name: Ruff format check
        run: .venv/bin/ruff format --check ccpnmr2.5/python/ 2>&1 | tail -20
        continue-on-error: true  # legacy code isn't formatted yet

  test-cext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9"

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev
          uv venv --python python3.14 .venv
          uv pip install --python .venv/bin/python setuptools numpy

      # Compile exactly ONE extension, the memops/MOPS data-backbone C spike.
      # CCP_EXT=memops.c.ShapeFile selects it by full name so the GL/Tk/X11
      # handler extensions are NOT built here (no tk-dev needed in this job).
      - name: Build ShapeFile extension (CCP_EXT=memops.c.ShapeFile)
        run: CCP_EXT=memops.c.ShapeFile .venv/bin/python setup.py build_ext --inplace

      - name: Verify import (canonical package path)
        run: |
          PYTHONPATH=ccpnmr2.5/python .venv/bin/python -c "
          from memops.c import ShapeFile
          sf = ShapeFile.ShapeFile(2, [16, 16])
          assert sf.ndim == 2, sf.ndim
          assert sf.ncomponents == 2, sf.ncomponents
          assert sf.points == [16, 16], sf.points
          sf.setComponentAmplitude(0, 1.0)
          print('C extension spike: PASS')
          "

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9"

      - name: Install dependencies
        run: |
          uv venv --python python3.14 .venv
          uv pip install --python .venv/bin/python \
            "numpy>=2.0" "pandas>=2.0" "Pillow>=10.0" \
            "olefile>=0.47" "requests>=2.31" \
            "pytest>=8.0" "pytest-cov>=5.0"

      # Hermetic, C-extension-free test files: pure-Python NEF core+cli, memops
      # meta-model/util, exporter and the (mock-driven) macOS two-finger
      # gesture state machine. They need no compiled .so at runtime, so this
      # runs reliably on a fresh 3.14 venv. (The compiled-extension suites and
      # the data-gated peak list import/export tests run in the standalone
      # distribution gate, from the installed state.)
      - name: Run test suite (Python 3.14)
        run: |
          .venv/bin/pytest \
            ccpnmr2.5/python/tests/test_nef_core.py \
            ccpnmr2.5/python/tests/test_nef_cli.py \
            ccpnmr2.5/python/tests/test_memops_meta_model.py \
            ccpnmr2.5/python/tests/test_memops_util.py \
            ccpnmr2.5/python/tests/test_exportNmrData.py \
            ccpnmr2.5/python/tests/test_mac_two_finger_remap.py \
            --verbose --tb=short

  # The distributable is the standalone binary (the project is only offered as
  # a standalone, not as a pip package). This gate builds the macOS standalone
  # tarball on a macos-latest runner and verifies it is portable: unpack it
  # OUTSIDE the source tree and launch the real entry points from the private
  # runtime. (The Linux x86_64 standalone is built/verified on the Linux build
  # box; a stock ubuntu-latest runner has no Tcl/Tk 9, which the C draw
  # extensions link against.)
  distribution:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9"

      # Tcl/Tk 9 headers for the C extensions (compile-time declarations only;
      # the private runtime's OWN bundled Tcl/Tk 9 dylibs are what get linked).
      - name: Install Tcl/Tk 9 headers (Homebrew)
        run: brew install tcl-tk

      - name: Build the macOS standalone (compiles all C extensions)
        run: ./make-standalone-macos.sh

      - name: Verify the standalone is portable (launch from a fresh unpack)
        run: |
          VER="$(awk -F'"' '/^version/{print $2; exit}' pyproject.toml)"
          ART="dist/ccpnmr-${VER}-macos-$(uname -m)-standalone.tar.gz"
          test -f "$ART" && echo "artifact: $ART"
          VDIR="$(mktemp -d)"
          tar xzf "$ART" -C "$VDIR"
          APP="$(find "$VDIR" -maxdepth 1 -mindepth 1 -type d)"
          # 1) private runtime is the right interpreter + Tcl/Tk 9
          "$APP/runtime/bin/python" --version           # expect 3.14
          "$APP/runtime/bin/python" -c "import tkinter; \
            assert tkinter.TclVersion.startswith('9.'), tkinter.TclVersion"
          # 2) the non-GUI console script resolves + runs from the tree
          "$APP/runtime/bin/ccpnmr-nef" --help >/dev/null
          # 3) the GUI app imports from the private runtime, data self-location works
          PYTHONHOME="$APP/runtime" "$APP/runtime/bin/python" -W ignore -c "
            import ccpnmr.analysis.AnalysisGui as G
            import ccpnmr.nefCli as N
            from memops.general.Io import getTopDirectory
            assert getTopDirectory().startswith('$APP/runtime'), getTopDirectory()
            print('portable launch OK:', G.__file__.split('/site-packages/')[-1])
          "
          rm -rf "$VDIR"
