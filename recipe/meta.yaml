# -----------------------------------------------------------------------------
# conda-forge recipe for ccpnmr 2.5.2 (Python 3.13)
#
# STARTING POINT only — not a complete, CI-ready conda-forge package. To publish
# you must:
#   * open a PR to conda-forge containing this recipe dir,
#   * fill in `sha256` (of the sdist tarball) and the correct source URL,
#   * confirm the C-extension build deps (compiler, GL, Tk, optional GSL) are
#     satisfiable in the conda-forge build environment,
#   * follow conda-forge style (see conda-forge.org docs / check-recipes).
#
# The package ships C extensions (see setup.py `ext_modules`); the sdist is
# used so they compile at build time. Meccano/GSL is optional (setup.py skips
# that ext and warns when GSL is absent).
# -----------------------------------------------------------------------------
{% set name = "ccpnmr" %}
{% set version = "2.5.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # Use the sdist built by `python -m build` (builds the C extensions at install
  # time) or a pinned VCS tag. Fill sha256 + a public tarball URL before a PR.
  url: https://pypi.io/projects/{{ name|lower }}/{{ version }}/  # TODO: real tarball URL
  sha256: ""  # TODO: sha256 of the source tarball

build:
  number: 0
  skip: true  # [py<313]
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
  host:
    - python
    - pip
    - cython
    - numpy
    - pandas
    - py-opengl
    - pillow
    - olefile
    - requests
    - python-dateutil
    - pytz
    - gsl  # optional: enables the grenoble Meccano ext (setup.py skips gracefully if absent)
  run:
    - python
    - numpy
    - pandas
    - py-opengl
    - pillow
    - olefile
    - requests
    - python-dateutil
    - pytz

test:
  imports:
    - memops
    - ccp
    - ccpnmr
  commands:
    - ccpnmr --help  # [not osx]

about:
  home: https://ccpnc.iqfr.csic.es/
  license: LGPL-2.1
  license_family: LGPL
  license_file:
  summary: "CCP NMR — NMR data analysis workbench (Python 3.13 port)"
  description: |
    CcpNmr analysis: assignment, structure, dynamics, format conversion and
    deposition tools for NMR, ported and built for Python 3.13 with rebuilt C
    extension layers.
  doc_url: https://ccpnc.iqfr.csic.es/

extra:
  recipe-maintainers:
    - ccpn-migration  # TODO: real maintainer GH handle(s)
